[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "event-sourced-ai-runtime"
version = "0.6.0"
description = "Event-sourced AI runtime with deterministic, governed AI action execution."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
keywords = ["ai", "agent", "governance", "security", "event-sourcing", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Security",
]
dependencies = [
    "requests",
    "python-dotenv",
    "pytest>=9",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
p5-server = "p5.server:main"
tanuq = "tanuq.cli:main"

[tool.setuptools.packages.find]
include = ["simulation*", "p5*", "tanuq*"]

[tool.setuptools.package-data]
tanuq = ["static/*.html", "static/*.js"]
p5 = ["static/*.html"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
markers = [
    "live_llm: runs a real LLM provider call; opt-in only (requires RUN_LIVE_LLM=1)",
]
