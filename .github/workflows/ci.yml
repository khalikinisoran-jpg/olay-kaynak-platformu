name: CI

on:
  push:
    branches: [main, worker-action-pipeline]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify package installs (packaging smoke)
        shell: bash
        run: |
          pip install -e . --quiet
          python -c "import simulation; from simulation.agent.approval.approval_console import ConsoleApprovalGateway; print('package-ok')"
          python -m p5.server --help
          p5-server --help || python -m p5.server --help
          python -c "from p5.config import load_config; cfg=load_config(); print(f'config-ok host={cfg.host} port={cfg.port}')"
          tanuq --version
          tanuq --help

      - name: Compile all packages
        run: python -m compileall -q simulation tests p5 tanuq

      - name: Secret scan (repo-local guard)
        run: python scripts/secret_guard.py

      - name: Run the full test suite
        run: python -m pytest -q

      - name: Run the adversarial corpus
        run: python -m pytest tests/security/adversarial_corpus_test.py -q

  packaging:
    name: packaging-gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Packaging regression gate (wheel -> clean venv -> product smoke)
        run: python -m pytest tests/test_tanuq_packaging.py -q

      - name: Whitespace check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            BASE_SHA="${HEAD_SHA}^"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.event.after }}"
          fi
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ] \
             || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No meaningful base/head pair; skipping whitespace check."
          elif [ "$BASE_SHA" = "$HEAD_SHA" ]; then
            echo "Base and head are identical; nothing to check."
          else
            git diff --check "$BASE_SHA...$HEAD_SHA"
          fi
