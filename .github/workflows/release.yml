name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build, validate and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m pip install -r requirements.txt

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate package metadata (twine check)
        run: python -m twine check dist/*

      - name: Packaging regression test (wheel -> clean venv -> smoke)
        run: python -m pytest tests/test_tanuq_packaging.py -q -p no:cacheprovider

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
